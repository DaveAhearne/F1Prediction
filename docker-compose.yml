services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0-full
    container_name: f1-mlflow
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=mlflow-artifacts:/artifacts
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --allowed-hosts "*"
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
  lakefs:
    image: treeverse/lakefs:latest
    container_name: f1-lakefs
    restart: unless-stopped
    user: root
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}
      - LAKEFS_INSTALLATION_USER_NAME=${LAKEFS_INSTALLATION_USER_NAME}
      - LAKEFS_INSTALLATION_ACCESS_KEY_ID=${LAKEFS_INSTALLATION_ACCESS_KEY_ID}
      - LAKEFS_INSTALLATION_SECRET_ACCESS_KEY=${LAKEFS_INSTALLATION_SECRET_ACCESS_KEY}
      - LAKEFS_DATABASE_TYPE=local
      - LAKEFS_DATABASE_LOCAL_PATH=/lakefs/metadata
      - LAKEFS_BLOCKSTORE_TYPE=local
      - LAKEFS_BLOCKSTORE_LOCAL_PATH=/lakefs/data
    volumes:
      - lakefs-data:/lakefs
    command: run
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/v1/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
  lakefs-setup:
    image: curlimages/curl:latest
    depends_on:
      lakefs:
        condition: service_healthy
    restart: on-failure
    entrypoint: [
      "sh", "-c",
      "curl -X POST http://f1-lakefs:8000/api/v1/setup_lakefs -H 'Content-Type: application/json' -d '{\"username\":\"${LAKEFS_INSTALLATION_USER_NAME}\",\"key\":{\"access_key_id\":\"${LAKEFS_INSTALLATION_ACCESS_KEY_ID}\",\"secret_access_key\":\"${LAKEFS_INSTALLATION_SECRET_ACCESS_KEY}\"}}' && curl -X POST http://f1-lakefs:8000/api/v1/setup_comm_prefs -H 'Content-Type: application/json' -d '{\"email\":\"admin@f1predictor.com\",\"firstName\":\"Admin\",\"lastName\":\"User\",\"companyName\":\"F1Predictor\",\"featureUpdates\":false,\"securityUpdates\":false}'"
    ]
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: f1-prefect
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      lakefs:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - prefect-data:/root/.prefect
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
  prefect-setup:
    image: python:3.12-slim
    depends_on:
      prefect:
        condition: service_healthy
    restart: on-failure
    env_file: .env.docker
    entrypoint:
      - python
      - -c
      - |
        import urllib.request, urllib.error, json, os, sys

        def create_var(name, value):
            data = json.dumps({"name": name, "value": json.loads(value)}).encode()
            req = urllib.request.Request(
                "http://f1-prefect:4200/api/variables/",
                data=data,
                headers={"Content-Type": "application/json"},
                method="POST"
            )
            try:
                urllib.request.urlopen(req)
                print(f"{name}: ok")
            except urllib.error.HTTPError as e:
                if e.code == 409:
                    print(f"{name}: already exists")
                else:
                    print(f"{name}: failed with status {e.code}")
                    sys.exit(1)

        create_var("lgbm_hyperparameters", os.environ["LGBM_HYPERPARAMETERS"])
        create_var("retraining_config", os.environ["RETRAINING_CONFIG"])
  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: f1-prefect-worker
    depends_on:
      prefect:
        condition: service_healthy
      lakefs:
        condition: service_healthy
      mlflow:
        condition: service_started
      evidently:
        condition: service_started
    environment:
      - PREFECT_API_URL=http://f1-prefect:4200/api
    env_file: .env.docker
    command: python src/f1_predictor/flows/pipeline_flow.py
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: f1-bootstrap
    depends_on:
      lakefs:
        condition: service_healthy
    restart: on-failure
    env_file: .env.docker
    volumes:
      - ./data:/app/data
    command: f1_bootstrap
  evidently:
    build:
      context: .
      dockerfile: Dockerfile.evidently
    container_name: f1-evidently
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - evidently-data:/evidently/workspace
    env_file: .env.docker
    restart: unless-stopped

volumes:
  mlflow-data:
  lakefs-data:
  prefect-data:
  evidently-data: