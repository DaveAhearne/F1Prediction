[project]
name = "f1_predictor"
version = "0.1.0"
requires-python = ">=3.10"

# MLflow lives here because both training and serving touch it
dependencies = [
    "pydantic",
    "pydantic-settings",
    "mlflow>=2.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["f1_predictor*", "ingest*"]

[project.optional-dependencies]
data = [
    "lakefs"
]
train = [
    "pandera[pandas]",
    "lightgbm",
    "pandas",
    "pandera",
    "scikit-learn",
    "notebook",
    "onnxmltools",
]
serv = [
    "fastapi",
    "uvicorn",
    "onnxruntime",
    "numpy",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
f1_serve = "f1_predictor.serve.api:main"
f1_bootstrap = "ingest.bootstrap:run"
f1_pipeline = "f1_predictor.pipelines.train_pipeline:run_pipeline"